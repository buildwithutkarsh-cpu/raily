<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <rect width="32" height="32" fill="#111111"/>
  <g fill="#F5F2EA">
    <!-- Train body -->
    <rect x="4" y="12" width="24" height="14" rx="2"/>
    <!-- Cabin -->
    <rect x="2" y="14" width="4" height="10" rx="1"/>
    <!-- Windows -->
    <rect x="8" y="15" width="5" height="4" rx="0.5"/>
    <rect x="15" y="15" width="5" height="4" rx="0.5"/>
    <rect x="22" y="15" width="5" height="4" rx="0.5"/>
    <!-- Wheels -->
    <circle cx="9" cy="28" r="2" fill="#111111" stroke="#F5F2EA" stroke-width="1"/>
    <circle cx="23" cy="28" r="2" fill="#111111" stroke="#F5F2EA" stroke-width="1"/>
    <!-- Headlight -->
    <circle cx="3" cy="18" r="1" fill="#C41E3A"/>
  </g>
</svg>
